name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Derivative inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      garm: ${{ steps.paths.outputs.garm }}
      provider: ${{ steps.paths.outputs.provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the existing manifest-owned Go compiler
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 0
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Resolve the provider's compiled package set
        id: packages
        run: just provider-packages
      - name: Classify derivative inputs
        id: paths
        env:
          PROVIDER_PACKAGE_DIRECTORIES: ${{ steps.packages.outputs.directories }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: just classify-derivatives
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.paths.outcome }}
          task: derivative-inputs
          name: derivative-inputs
          read-token: ${{ steps.setup.outputs.read-token }}

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select the existing manifest-owned Go compiler
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 1
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Verify declared module dependencies
        id: dependencies
        run: just setup
      - name: Run the existing Go and feedback fixture tests
        id: project
        run: just test-unit
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.dependencies.outcome == 'failure' && 'failure' || steps.project.outcome }}
          task: unit-tests
          name: unit-tests
          read-token: ${{ steps.setup.outputs.read-token }}

  race:
    name: Race
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select the existing manifest-owned Go compiler
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 1
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Verify declared module dependencies
        id: dependencies
        run: just setup
      - name: Run the existing race detector
        id: project
        run: just test-race
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.dependencies.outcome == 'failure' && 'failure' || steps.project.outcome }}
          task: race-tests
          name: race-tests
          read-token: ${{ steps.setup.outputs.read-token }}

  static:
    name: Static and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select the existing manifest-owned Go compiler
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 1
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Verify declared module dependencies
        id: dependencies
        run: just setup
      - name: Verify formats, both vet scopes, release metadata and ordinary builds
        id: project
        run: just verify-static
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.dependencies.outcome == 'failure' && 'failure' || steps.project.outcome }}
          task: static-build
          name: static-build
          read-token: ${{ steps.setup.outputs.read-token }}

  derivative:
    name: Reproducible GARM derivative
    needs: changes
    if: ${{ needs.changes.outputs.garm == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 1
      - name: Build the declared GARM derivative
        id: project
        run: just build-garm-derivative
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: garm-derivative
          name: garm-derivative
          read-token: ${{ steps.setup.outputs.read-token }}

  provider-derivative:
    name: Reproducible provider derivative
    needs: changes
    if: ${{ needs.changes.outputs.provider == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the existing manifest-owned Go compiler
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 0
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Resolve validated artifact identity
        id: release
        run: just provider-identity
      - name: Resolve the provider's compiled package set
        id: packages
        run: just provider-packages
      - name: Refuse provider source drift after the release commit
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          HEAD_COMMIT: ${{ github.sha }}
          PROVIDER_PACKAGE_DIRECTORIES: ${{ steps.packages.outputs.directories }}
        run: just check-provider-source
      - name: Checkout exact provider source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.release.outputs.source_commit }}
          path: provider-source
      - name: Rebuild and verify exact provider bytes
        id: project
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
          EXPECTED_SHA256: ${{ steps.release.outputs.binary_sha256 }}
        run: just qualify-provider
      - name: Publish verified provider candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garm-provider-incus-${{ steps.release.outputs.source_commit }}
          path: ${{ runner.temp }}/provider-a
          # Evidence, not transport: the reproducibility gate verified these
          # exact bytes, and 30 days is a declared contract rather than
          # whatever the org default happens to be.
          retention-days: 30
          if-no-files-found: error
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: provider-derivative
          name: provider-derivative
          read-token: ${{ steps.setup.outputs.read-token }}

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Prepare the public CI job
        id: setup
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          managed: 'false'
          fetch-depth: 0
          tools: zizmor@1.32.0,shellcheck@0.11.0
          tool-assets: .github/ci-tools.json
      - name: Check source, workflows, extracted shell and complete Git history
        id: project
        run: just check-ci
      - name: Complete the public CI job
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: workflow-source
          name: workflow-source
          read-token: ${{ steps.setup.outputs.read-token }}

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@98ff340ab5d2e0f62821a6ee25fd4161b87f59ba # v0.6.69
    permissions:
      contents: read

  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs: [changes, test, race, static, derivative, provider-derivative, workflows, merge-stops]
    permissions: {}
    steps:
      - name: Report every actual producer and only declared derivative skips
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: >-
            {"changes":"success","test":"success","race":"success","static":"success","derivative":"${{ needs.changes.outputs.garm == 'true' && 'success' || 'skipped' }}","provider-derivative":"${{ needs.changes.outputs.provider == 'true' && 'success' || 'skipped' }}","workflows":"success","merge-stops":"${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}"}
        run: |
          jq -e '.changes.outputs | (.garm == "true" or .garm == "false") and (.provider == "true" or .provider == "false")' <<< "$NEEDS"
          jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
